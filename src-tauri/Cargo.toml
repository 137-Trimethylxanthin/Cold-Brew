[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[features]
default = ["native_spotify"]
native_spotify = [
  "librespot-core",
  "librespot-playback",
  "librespot-connect",
  "librespot-protocol",
  "librespot-oauth",
]
mpris = ["dep:mpris-server"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
reqwest = { version = "0.12.24", features = ["json"] }
lazy_static = "1.4.0"
ezsockets = { version = "0.6.2", features = ["server", "tungstenite"] }
async-trait = { version = "0.1.80", features = [] }
tracing = "0.1"
tracing-subscriber = "0.3.18"
thiserror = "2"
tokio = { version = "1.37.0", features = ["full"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
walkdir = "2.5.0"
lofty = "0.24.0"
keyring-core = "1.0.0"
dotenvy = "0.15"
rodio = "0.22.2"
md-5 = "0.10.6"
base64 = "0.22.1"
rand = "0.8.5"
sha2 = "0.10.9"
musicbrainz_rs = { version = "0.13", features = ["async"] }
notify = { version = "7", default-features = false, features = [
  "macos_kqueue",
] }
chrono = { version = "0.4", features = ["serde"] }
librespot-core = { version = "0.8", optional = true }
librespot-playback = { version = "0.8", optional = true, default-features = false, features = [
  "rodio-backend",
] }
librespot-connect = { version = "0.8", optional = true }
librespot-protocol = { version = "0.8", optional = true }
librespot-oauth = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scan_benchmark"
harness = false

[[bench]]
name = "playback_benchmark"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
mpris-server = { version = "0.10", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = [
  "crypto-rust",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0.0"
