# Trunk config for Cold-Brew — Tauri + SvelteKit music player
# https://docs.trunk.io/cli
version: 0.1
cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.10.1
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4

lint:
  enabled:
    # --- Formatters ---
    - prettier@3.8.3 # JS/TS/Svelte/CSS/JSON/MD
    - rustfmt@1.65.0 # Rust
    - taplo@0.10.0 # TOML (Cargo.toml)
    - shfmt@3.9.0 # Shell scripts

    # --- Linters ---
    # NOTE: clippy runs via system Rust (`cargo clippy`), not Trunk
    - yamllint@1.38.0 # YAML configs
    - markdownlint@0.48.0 # Markdown docs
    - shellcheck@0.10.0 # Shell script analysis
    - cspell@8.17.0 # Spell check code

    # --- Assets ---
    - oxipng@10.1.1 # PNG optimization
    - svgo@3.3.2 # SVG optimization (icons)

    # --- Housekeeping ---
    - sort-package-json@3.1.0 # Keep package.json tidy

    # --- Safety ---
    - git-diff-check # Blocks commits with unformatted code
    - trufflehog@3.95.5 # Secret scanning

  ignore:
    - linters: [ALL]
      paths:
        - node_modules/**
        - src-tauri/target/**
        - build/**
        - .svelte-kit/**
        - .ai/**

  definitions:
    - name: cspell
      files: [svelte, typescript, rust, markdown, json, yaml, toml]
      direct_configs: [.trunk/configs/.cspell.yaml]

actions:
  enabled:
    - trunk-announce
    - trunk-upgrade-available
    - git-blame-ignore-revs
