[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
reqwest = { version = "0.12.24", features = ["json"] }
lazy_static = "1.4.0"
ezsockets = { version = "0.6.2", features = ["server", "tungstenite"] }
async-trait = { version = "0.1.80", features = [] }
tracing-subscriber = "0.3.18"
tokio = { version = "1.37.0", features = ["full"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
walkdir = "2.5.0"
lofty = "0.24.0"
keyring-core = "1.0.0"
rodio = "0.22.2"
md-5 = "0.10.6"
base64 = "0.22.1"
rand = "0.8.5"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = [
  "crypto-rust",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0.0"
