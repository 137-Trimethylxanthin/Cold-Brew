<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f4e37"/>
      <stop offset="100%" stop-color="#4a3222"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Coffee cup body -->
  <ellipse cx="420" cy="700" rx="200" ry="80" fill="url(#coffee)"/>
  <rect x="220" y="380" width="400" height="320" rx="30" fill="url(#coffee)"/>
  <ellipse cx="420" cy="380" rx="200" ry="70" fill="#7a5740"/>
  <!-- Coffee liquid -->
  <ellipse cx="420" cy="390" rx="185" ry="60" fill="#3c1f0e"/>
  <!-- Cup handle -->
  <path d="M620 460 Q760 460 760 560 Q760 660 620 660" fill="none" stroke="#6f4e37" stroke-width="40" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M340 350 Q300 250 330 180" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M420 340 Q440 230 420 150" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  <path d="M500 350 Q540 240 510 170" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <!-- Music notes -->
  <g transform="translate(700, 250)">
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="#e94560" transform="rotate(-20)"/>
    <rect x="28" y="-80" width="10" height="80" rx="5" fill="#e94560"/>
    <path d="M38 -80 Q65 -70 55 -45" fill="none" stroke="#e94560" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(760, 320) scale(0.7)">
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="#e94560" transform="rotate(-20)"/>
    <rect x="28" y="-80" width="10" height="80" rx="5" fill="#e94560"/>
    <path d="M38 -80 Q65 -70 55 -45" fill="none" stroke="#e94560" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
