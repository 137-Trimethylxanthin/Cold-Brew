# Trunk config for Cold-Brew — Tauri + SvelteKit music player
# https://docs.trunk.io/cli
version: 0.1
cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.10.1
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4

lint:
  enabled:
    # --- Formatters ---
    - prettier@3.8.3 # JS/TS/Svelte/CSS/JSON/MD
    - rustfmt@1.65.0 # Rust
    - taplo@0.10.0 # TOML (Cargo.toml)
    - shfmt@3.9.0 # Shell scripts

    # --- Linters ---
    # NOTE: clippy runs via system Rust (`cargo clippy`), not Trunk
    #       (Trunk bundles Rust 1.65 which is too old for our deps)
    - yamllint@1.38.0 # YAML configs
    - markdownlint@0.48.0 # Markdown docs
    - shellcheck@0.10.0 # Shell script analysis
    - oxipng@10.1.1 # PNG optimization

    # --- Safety ---
    - git-diff-check # Blocks commits with unformatted code
    - trufflehog@3.95.5 # Secret scanning (catches leaked keys)
